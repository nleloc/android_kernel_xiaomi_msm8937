name: Build towa kernel

on:
  push:
    branches: [ j1p-port ]
  workflow_dispatch:
    inputs:
      DEFCONFIG:
        description: 'Enter defconfig name'
        required: true
        type: string
        default: 'PQ4002_defconfig'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev \
            libncurses5-dev device-tree-compiler \
            kmod cpio rsync u-boot-tools

      - name: Install cross-compile toolchains
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
                                   gcc-arm-linux-gnueabi g++-arm-linux-gnueabi

      - name: Build kernel
        run: |
          set -e
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          make O=out ${{ inputs.DEFCONFIG }}
          make O=out -j"$(nproc)" 2>&1 | tee build-log.txt

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt

      - name: Upload kernel image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: towa-kernel
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dts/qcom/towa.dtb
          if-no-files-found: warn